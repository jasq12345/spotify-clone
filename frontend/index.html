<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="logo">
        <img src="images/spotify-brands-solid-full.svg" alt="Spotify" />
      </div>
      <div class="search-wrap">
        <button class="round-btn" id="btn-home" title="Queue">
          <img src="images/home.svg" alt="home" />
        </button>
        <div class="search">
          <img src="images/magnifying-glass-solid-full.svg" alt="search" />
          <input id="search-input" type="text" placeholder="What do you want to play?" />
        </div>
      </div>
      <button class="round-btn avatar">
        <img src="images/person.webp" alt="profile" />
      </button>
    </header>

    <aside class="library">
      <div class="row">
        <h2>Your Library</h2>
        <div class="group">
          <button class="icon" id="btn-new-playlist" title="New playlist"><img src="images/circle-plus-solid-full.svg" alt="new playlist" /></button>
          <button class="icon"><img src="images/expand-solid-full.svg" alt="expand" /></button>
        </div>
      </div>

      <button class="chip">Playlists</button>

      <div class="row">
        <button class="icon"><img src="images/magnifying-glass-solid-full.svg" alt="search" /></button>
        <button class="text-btn">
          Recents
          <img src="images/burger.svg" alt="" />
        </button>
      </div>

      <div class="lib-list">
        <button class="playlist active" id="lib-queue">
          <img src="images/liked.png" alt="" />
          <div>
            <p class="title">Queue</p>
            <p class="subtitle">
              <img class="pin" src="images/thumbtack-solid-full.svg" alt="pinned" />
              <span id="lib-queue-count">0 songs</span>
            </p>
          </div>
        </button>
        <div class="lib-list" id="lib-playlists"></div>
        <p class="lib-note" id="lib-note" hidden>Playlists are not available on the backend yet.</p>
      </div>
    </aside>

    <main class="content">
      <section class="hero">
        <img src="images/liked.png" alt="" />
        <div>
          <p id="hero-type">Queue</p>
          <h1 id="hero-title">Queue</h1>
          <p class="hero-info">
            <img src="images/person.webp" alt="" />
            <b>User</b> • <span id="hero-count">0 songs</span>
          </p>
        </div>
      </section>

      <section class="actions">
        <div>
          <button class="play-big" id="btn-play-big" title="Play"><img src="images/play.svg" alt="play" /></button>
          <button class="icon big" id="btn-shuffle-big" title="Shuffle"><img src="images/shuffle-solid-full.svg" alt="shuffle" /></button>
          <button class="icon big" id="btn-add-song" title="Add song"><img src="images/circle-plus-solid-full.svg" alt="add song" /></button>
        </div>
        <div class="view-actions">
          <button class="text-btn" id="btn-clear">Clear queue</button>
          <button class="text-btn" id="btn-rename" hidden>Rename</button>
          <button class="text-btn" id="btn-delete-playlist" hidden>Delete playlist</button>
        </div>
      </section>

      <table class="tracks">
        <thead>
          <tr>
            <th>#</th>
            <th>Title</th>
            <th class="hide-mobile">Album</th>
            <th class="hide-mobile">Date added</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="tracks-body"></tbody>
      </table>
    </main>

    <aside class="now-playing">
      <div class="row">
        <button class="icon"><img src="images/window-restore-solid-full.svg" alt="hide" /></button>
        <h3 id="np-title-top">Nothing playing</h3>
        <button class="icon"><img src="images/ellipsis-solid-full.svg" alt="more" /></button>
        <button class="icon"><img src="images/expand-solid-full.svg" alt="expand" /></button>
      </div>

      <img class="big-cover" src="images/cover.jpg" alt="cover" />

      <div class="row">
        <div>
          <h2 id="np-title">Nothing playing</h2>
          <p class="subtitle" id="np-artist">—</p>
        </div>
        <div class="group">
          <button class="icon"><img src="images/circle-plus-solid-full.svg" alt="add" /></button>
          <button class="icon"><img src="images/arrow-up-right-from-square-solid-full.svg" alt="share" /></button>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <h3>Next in queue</h3>
          <button class="text-btn" id="btn-open-queue">Open queue</button>
        </div>
        <div class="song">
          <div class="no-cover"></div>
          <div>
            <p class="title" id="queue-title">Nothing queued</p>
            <p class="subtitle" id="queue-artist">—</p>
          </div>
        </div>
      </div>
    </aside>

    <footer class="player">
      <div class="song">
        <img src="images/cover.jpg" alt="" />
        <div>
          <p class="title" id="title-music">Nothing playing</p>
          <p class="subtitle" id="author-music">—</p>
        </div>
        <button class="icon"><img src="images/circle-plus-solid-full.svg" alt="add" /></button>
      </div>

      <div class="controls">
        <div class="buttons">
          <button class="icon" id="btn-shuffle" title="Shuffle queue"><img src="images/shuffle-solid-full.svg" alt="shuffle" /></button>
          <button class="icon" id="btn-prev" title="Previous"><img src="images/backward-step-solid-full.svg" alt="previous" /></button>
          <button class="play-small" id="btn-play" title="Play"><img src="images/play.svg" alt="play" /></button>
          <button class="icon" id="btn-next" title="Next"><img src="images/forward-step-solid-full.svg" alt="next" /></button>
          <button class="icon" id="btn-repeat" title="Repeat"><img src="images/repeat-solid-full.svg" alt="repeat" /></button>
        </div>
        <div class="progress">
          <span id="time-music">0:00</span>
          <div class="bar" id="song-line"><div></div></div>
          <span id="duration-music">0:00</span>
        </div>
      </div>

      <div class="extras">
        <button class="icon"><img src="images/microphone-solid-full.svg" alt="lyrics" /></button>
        <button class="icon"><img src="images/list-solid-full.svg" alt="queue" /></button>
        <button class="icon"><img src="images/bluetooth-brands-solid-full.svg" alt="devices" /></button>
        <button class="icon" id="btn-mute" title="Mute"><img src="images/volume-solid-full.svg" alt="volume" /></button>
        <div class="bar volume" id="volume-control"><div></div></div>
        <button class="icon"><img src="images/picture-in-picture-solid-full.svg" alt="mini player" /></button>
      </div>
    </footer>

    <dialog class="modal" id="song-dialog">
      <form method="dialog" id="song-form">
        <h3 id="song-dialog-title">Add song</h3>
        <input name="title" type="text" placeholder="Title" maxlength="30" required />
        <input name="artist" type="text" placeholder="Artist" maxlength="30" required />
        <input class="song-extra" name="album" type="text" placeholder="Album (optional)" maxlength="30" />
        <input class="song-extra" name="duration" type="text" placeholder="Length, e.g. 3:45 (optional)" pattern="\d+(:[0-5]\d)?" title="Minutes:seconds, e.g. 3:45" />
        <div class="dialog-buttons">
          <button value="cancel" formnovalidate class="text-btn">Cancel</button>
          <button value="ok" class="dialog-submit" id="song-dialog-submit">Add</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="name-dialog">
      <form method="dialog" id="name-form">
        <h3 id="name-dialog-title">New playlist</h3>
        <input name="name" type="text" placeholder="Playlist name" maxlength="30" required />
        <div class="dialog-buttons">
          <button value="cancel" formnovalidate class="text-btn">Cancel</button>
          <button value="ok" class="dialog-submit">Save</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="pick-dialog">
      <form method="dialog">
        <h3>Add to playlist</h3>
        <select id="pick-select" aria-label="Playlist"></select>
        <div class="dialog-buttons">
          <button value="cancel" formnovalidate class="text-btn">Cancel</button>
          <button value="ok" class="dialog-submit">Add</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="confirm-dialog">
      <form method="dialog">
        <h3>Are you sure?</h3>
        <p id="confirm-text"></p>
        <div class="dialog-buttons">
          <button value="cancel" class="text-btn">Cancel</button>
          <button value="ok" class="dialog-submit danger" id="confirm-ok">Confirm</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
