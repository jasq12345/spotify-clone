<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="logo">
        <img src="images/spotify-brands-solid-full.svg" alt="Spotify" />
      </div>
      <div class="search-wrap">
        <button class="round-btn">
          <img src="images/home.svg" alt="home" />
        </button>
        <div class="search">
          <img src="images/magnifying-glass-solid-full.svg" alt="search" />
          <input type="text" placeholder="What do you want to play?" />
        </div>
      </div>
      <button class="round-btn avatar">
        <img src="images/person.webp" alt="profile" />
      </button>
    </header>

    <aside class="library">
      <div class="row">
        <h2>Your Library</h2>
        <div class="group">
          <button class="icon"><img src="images/circle-plus-solid-full.svg" alt="create" /></button>
          <button class="icon"><img src="images/expand-solid-full.svg" alt="expand" /></button>
        </div>
      </div>

      <button class="chip">Playlists</button>

      <div class="row">
        <button class="icon"><img src="images/magnifying-glass-solid-full.svg" alt="search" /></button>
        <button class="text-btn">
          Recents
          <img src="images/burger.svg" alt="" />
        </button>
      </div>

      <div class="playlist active">
        <img src="images/liked.png" alt="Liked Songs" />
        <div>
          <p class="title">Liked Songs</p>
          <p class="subtitle">
            <img class="pin" src="images/thumbtack-solid-full.svg" alt="pinned" />
            Playlist • <span id="playlist-music-count">4</span> songs
          </p>
        </div>
      </div>
    </aside>

    <main class="content">
      <section class="hero">
        <img src="images/liked.png" alt="Liked Songs" />
        <div>
          <p>Playlist</p>
          <h1>Liked Songs</h1>
          <p class="hero-info">
            <img src="images/person.webp" alt="" />
            <b>User</b> • 4 songs
          </p>
        </div>
      </section>

      <section class="actions">
        <div>
          <button class="play-big"><img src="images/play.svg" alt="play" /></button>
          <button class="icon big"><img src="images/shuffle-solid-full.svg" alt="shuffle" /></button>
          <button class="icon big"><img src="images/download.svg" alt="download" /></button>
        </div>
        <button class="text-btn">
          List
          <img src="images/list-solid-full.svg" alt="" />
        </button>
      </section>

      <table class="tracks">
        <thead>
          <tr>
            <th>#</th>
            <th>Title</th>
            <th class="hide-mobile">Album</th>
            <th class="hide-mobile">Date added</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="tracks-body">
          
        </tbody>
      </table>
    </main>

    <aside class="now-playing">
      <div class="row">
        <button class="icon"><img src="images/window-restore-solid-full.svg" alt="hide" /></button>
        <h3>I Was Made For Lovin' You</h3>
        <button class="icon"><img src="images/ellipsis-solid-full.svg" alt="more" /></button>
        <button class="icon"><img src="images/expand-solid-full.svg" alt="expand" /></button>
      </div>

      <img class="big-cover" src="images/cover.jpg" alt="I Was Made For Lovin' You cover" />

      <div class="row">
        <div>
          <h2>I Was Made For Lovin' You</h2>
          <p class="subtitle">KISS</p>
        </div>
        <div class="group">
          <button class="icon"><img src="images/circle-plus-solid-full.svg" alt="add" /></button>
          <button class="icon"><img src="images/arrow-up-right-from-square-solid-full.svg" alt="share" /></button>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <h3>Next in queue</h3>
          <button class="text-btn">Open queue</button>
        </div>
        <div class="song">
          <img src="images/To_Brazil!.jpg" alt="" />
          <div>
            <p class="title">To Brazil!</p>
            <p class="subtitle">Vengaboys</p>
          </div>
        </div>
      </div>
    </aside>

    <footer class="player">
      <div class="song">
        <img src="images/cover.jpg" alt="" />
        <div>
          <p class="title" id="title-music">I Was Made For Lovin' You</p>
          <p class="subtitle" id="author-music">KISS</p>
        </div>
        <button class="icon"><img src="images/circle-plus-solid-full.svg" alt="add" /></button>
      </div>

      <div class="controls">
        <div class="buttons">
          <button class="icon"><img src="images/shuffle-solid-full.svg" alt="shuffle" /></button>
          <button class="icon"><img src="images/backward-step-solid-full.svg" alt="previous" /></button>
          <button class="play-small"><img src="images/play.svg" alt="play" /></button>
          <button class="icon"><img src="images/forward-step-solid-full.svg" alt="next" /></button>
          <button class="icon"><img src="images/repeat-solid-full.svg" alt="repeat" /></button>
        </div>
        <div class="progress">
          <span>0:00</span>
          <div class="bar" id="song-line"><div></div></div>
          <span>4:31</span>
        </div>
      </div>

      <div class="extras">
        <button class="icon"><img src="images/microphone-solid-full.svg" alt="lyrics" /></button>
        <button class="icon"><img src="images/list-solid-full.svg" alt="queue" /></button>
        <button class="icon"><img src="images/bluetooth-brands-solid-full.svg" alt="devices" /></button>
        <button class="icon"><img src="images/volume-solid-full.svg" alt="volume" /></button>
        <div class="bar volume" id="volume-control"><div></div></div>
        <button class="icon"><img src="images/picture-in-picture-solid-full.svg" alt="mini player" /></button>
      </div>
    </footer>
  </body>
</html>
