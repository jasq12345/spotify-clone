<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

    <body>
      <header>
            <section class="Header1">
                <button class="ButtonHeader">&lt</button>
                <button class="ButtonHeader">&gt</button>
            </section>

            <section class="Header2">
                <button class="Buttons">
                    <img src="images/home.png.webp" alt="Home">
                </button>
                <input type="text" placeholder="What do you want to listen?">
            </section>

            <section class="Header3">
                    <button class="Buttons">
                        <img src="images/person-silhouette-white-icon.png.webp" alt="Profile picture">
                    </button>        
            </section>
        </header>

       <aside class="library">
        <header class="library__header">
          <h3>Biblioteka</h3>
          <div class="library__actions">
            <button class="icon-button">+</button>
            <button class="icon-button">
              <img src="images/expand-solid-full.svg" alt="rozwiń" width="20" height="20" />
            </button>
          </div>
        </header>

        <button class="chip">Playlisty</button>

        <div class="library__toolbar">
          <img src="images/magnifying-glass-solid-full.svg" alt="szukaj"  width="20" height="20" />
          <button class="sort-button">
            Ostatnie
            <img src="images/burger.svg" alt="widok listy" class="sort-icon" width="20" height="20"/>
          </button>
        </div>

        <ul class="library__list">
          <li class="library__item">
            <img class="library__cover" src="images/spotifty.png" alt="okładka" width="48" height="48" />
            <div class="library__info">
              <h4>Polubione utwory</h4>
              <p>
                <img src="images/thumbtack-solid-full.svg" alt="przypięte" width="14" height="14" />
                <span>Playlista • <span id="playlist-music-count">636</span> utworów</span>
              </p>
            </div>
          </li>
        </ul>
      </aside>


    
        

       
     
  </body>
</html>
